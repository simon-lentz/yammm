version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      runtime-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: scope
  # The vscode extension has its own npm manifest; the npm ecosystem does
  # not recurse from the repo root, so the directory must be named.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    groups:
      vscode-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The types must not pass engines.vscode in package.json: vsce refuses
      # to package an extension whose @types/vscode is newer.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typescript-eslint names the TypeScript majors it reads.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build"
      include: scope
