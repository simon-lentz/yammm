version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      runtime-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
      include: scope
