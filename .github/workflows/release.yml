name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  # The assets ship for darwin, Linux and Windows, so every host's lint, vet and
  # suite, and the Neo4j server matrix, run at the tagged commit before any asset
  # is built. A called workflow runs with this workflow's github context, so it
  # checks out the tag.
  #
  # A job that calls a workflow cannot set timeout-minutes; each job of a
  # called workflow carries its own. The release job times out at 15 minutes,
  # about three times its slowest measured run.
  test:
    uses: ./.github/workflows/yammm_test.yml
  # The VSIX publishes at package.json's version and the assets are stamped with
  # the tag, so a tag package.json does not carry ships neither. The test
  # workflow holds the other version sites equal to package.json.
  version:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the version is the tag's
        run: |
          VERSION="v$(jq -r .version lsp/editors/vscode/package.json)"
          if [ "${GITHUB_REF_TYPE}" != tag ] || [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "::error::package.json's version is ${VERSION}, and this run is ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}: a release ships only from the tag package.json carries"
            exit 1
          fi
  # The VS Code extension bundles yammm-lsp, so it is published by this run,
  # from the tag and after the same tests, beside the assets. A publish cut
  # short is finished by re-running this run's failed jobs: the publish step
  # skips each target already at the version.
  publish:
    needs: [test, version]
    uses: ./.github/workflows/publish_vscode.yml
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
  release:
    needs: [test, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all platforms
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make build-all VERSION="$VERSION"
          make build-cli-all VERSION="$VERSION"
      - name: Create archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd bin
          for dir in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            tar -czf "yammm-lsp-${VERSION}-${dir}.tar.gz" -C "${dir}" yammm-lsp
            tar -czf "yammm-${VERSION}-${dir}.tar.gz" -C "${dir}" yammm
          done
          for dir in windows-amd64 windows-arm64; do
            (cd "${dir}" && zip "../yammm-lsp-${VERSION}-${dir}.zip" yammm-lsp.exe)
            (cd "${dir}" && zip "../yammm-${VERSION}-${dir}.zip" yammm.exe)
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            bin/yammm-lsp-${{ github.ref_name }}-darwin-arm64.tar.gz
            bin/yammm-lsp-${{ github.ref_name }}-darwin-amd64.tar.gz
            bin/yammm-lsp-${{ github.ref_name }}-linux-amd64.tar.gz
            bin/yammm-lsp-${{ github.ref_name }}-linux-arm64.tar.gz
            bin/yammm-lsp-${{ github.ref_name }}-windows-amd64.zip
            bin/yammm-lsp-${{ github.ref_name }}-windows-arm64.zip
            bin/yammm-${{ github.ref_name }}-darwin-arm64.tar.gz
            bin/yammm-${{ github.ref_name }}-darwin-amd64.tar.gz
            bin/yammm-${{ github.ref_name }}-linux-amd64.tar.gz
            bin/yammm-${{ github.ref_name }}-linux-arm64.tar.gz
            bin/yammm-${{ github.ref_name }}-windows-amd64.zip
            bin/yammm-${{ github.ref_name }}-windows-arm64.zip
