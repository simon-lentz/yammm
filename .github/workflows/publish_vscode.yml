name: Publish VS Code Extension
# Called by the release workflow alone, after its test workflow, on a v* tag:
# no event starts this workflow by itself, so no branch is published.
on:
  workflow_call:
    secrets:
      VSCE_PAT:
        required: true
# Every job carries a timeout, so a hung runner costs minutes rather than
# GitHub's six-hour default. 15 minutes is seven times the slowest job measured,
# and a publish cut short is safe to run again.
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            bin_dir: darwin-arm64
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            bin_dir: darwin-amd64
          - target: linux-x64
            goos: linux
            goarch: amd64
            bin_dir: linux-amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
            bin_dir: linux-arm64
          - target: win32-x64
            goos: windows
            goarch: amd64
            bin_dir: windows-amd64
            ext: .exe
          - target: win32-arm64
            goos: windows
            goarch: arm64
            bin_dir: windows-arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build LSP binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p lsp/editors/vscode/bin/${{ matrix.bin_dir }}
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o lsp/editors/vscode/bin/${{ matrix.bin_dir }}/yammm-lsp${{ matrix.ext }} \
            ./cmd/yammm-lsp
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: lsp/editors/vscode
        run: npm ci
      - name: Package VSIX
        working-directory: lsp/editors/vscode
        run: npx vsce package --target ${{ matrix.target }} --no-dependencies
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: lsp/editors/vscode/*.vsix
  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - name: List VSIX files
        run: ls -la vsix/
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # One vsce call per VSIX, so a platform already at this version is
        # skipped instead of ending the step. A single call over the whole glob
        # cannot tell "already published" from "failed to publish": it stops on
        # the first already-published target and leaves every later platform
        # unpublished, which makes a partly-published version unrecoverable by
        # a re-run. Re-running this step must always be safe.
        run: |
          shopt -s nullglob
          vsixes=(vsix/*.vsix)
          if [ ${#vsixes[@]} -eq 0 ]; then
            echo "::error::no VSIX files under vsix/ — the build job produced nothing to publish"
            exit 1
          fi

          published=0
          skipped=0
          for vsix in "${vsixes[@]}"; do
            if out=$(vsce publish --packagePath "$vsix" -p "$VSCE_PAT" 2>&1); then
              echo "published: $vsix"
              published=$((published + 1))
            elif printf '%s' "$out" | grep -qi 'already exists'; then
              echo "skipped, already at this version: $vsix"
              skipped=$((skipped + 1))
            else
              printf '%s\n' "$out" >&2
              echo "::error::failed to publish $vsix"
              exit 1
            fi
          done

          echo "published $published, skipped $skipped, of ${#vsixes[@]} target(s)"
