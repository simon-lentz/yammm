name: YAMMM Test
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch: {}
jobs:
  test:
    name: Test Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go
      # Root module
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --config=.golangci.yml
      - name: Test
        # -race enforces the data-race gate in CI rather than as local
        # etiquette; -shuffle=on surfaces inter-test order coupling, which
        # large-scale test dedup/merging is most likely to introduce.
        run: go test -v -race -shuffle=on ./...
