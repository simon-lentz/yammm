name: YAMMM Test
on:
  # `*` stops at a slash, so a branch named feature/x would run nothing; `**`
  # matches every branch. A tag runs this workflow through release.yml.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}
  workflow_call: {}
jobs:
  # One job definition on every host the module supports. Windows and macOS each
  # carry path rules Linux lacks — a backslash separator and UNC volumes, a
  # case-insensitive volume spelled through fcntl(F_GETPATH) — so each host
  # lints, vets and runs the whole suite through scripts/test.sh, the pre-commit
  # hook's test definition. The release workflow calls this workflow and builds
  # no asset until every job here has passed. Lint, vet and test each run after
  # an earlier step fails, and fail-fast is off, so one run reports every host's
  # every failure.
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            vet_args: ""
          - name: Windows
            os: windows-latest
            vet_args: --host
          - name: macOS
            os: macos-latest
            vet_args: --host
    defaults:
      run:
        # bash on every host: pwsh reports only the last command's exit status.
        shell: bash
    steps:
      # Git for Windows checks out with core.autocrlf=true, which would give
      # diag's goldens CRLF line endings its renderer never writes. Linux and
      # macOS already default to false, so the step is the same on every host.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The linter is built from this module's tool dependency, not downloaded.
      # A release binary and a `go build` of the same golangci-lint version are
      # not the same linter: the release embeds whichever golang.org/x/tools its
      # own build resolved, while this one links the version go.mod pins, so the
      # two disagree about which modernize analyzers exist. Downloading it makes
      # the lint surface move with golangci-lint's release cadence and puts this
      # step beyond the reach of any local check; building it makes go.mod the
      # single source of truth, so the surface moves only on a deliberate
      # x/tools bump and `go tool golangci-lint run` reproduces this step
      # exactly. install-mode: none keeps the action's inline PR annotations
      # while running the binary built here. An output path ending in a
      # separator names a directory, so Windows gets golangci-lint.exe.
      - name: Build the pinned linter
        run: |
          go build -o "${{ runner.temp }}/bin/" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
      # The action's own `verify` fetches the schema over the network, which
      # failed lint on transient fetch errors; the script reads the schema the
      # pinned linter's module ships. The pre-commit hook runs the same script.
      - name: Verify the linter config
        run: scripts/lintconfig.sh
      # The analysis cache is never carried between runs. The action restores a
      # cache by key prefix when the exact key is absent, so a run inherits
      # entries a different linter build wrote; one such cache reported 47
      # staticcheck findings in files that every cache-free lint of the same
      # tree passes. A cold lint costs under a minute more than a cached one.
      - name: golangci-lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          verify: false
          skip-cache: true
          args: --config=.golangci.yml
      - name: Vet
        if: ${{ !cancelled() }}
        # The Linux job vets every target the module's build constraints select;
        # the other hosts vet their own build.
        run: scripts/vet.sh ${{ matrix.vet_args }}
      - name: Test
        if: ${{ !cancelled() }}
        run: scripts/test.sh
  # The adapter compares its own literals against strings a Neo4j server fills
  # in. Those strings change between server generations — the node uniqueness
  # constraint type is reported as UNIQUENESS by 5.x and NODE_PROPERTY_UNIQUENESS
  # by 2026.x — and a stale comparison fails SILENTLY, reporting a correct
  # database as drifted. Running one server per supported generation is what
  # turns "supports Neo4j 5.0+" from a claim in the docs into a tested one, and
  # it is why accepting both spellings is required rather than renaming to the
  # newer one.
  #
  # Behind the neo4j_integration build tag, so scripts/test.sh stays Docker-free.
  # Linux only: GitHub's Windows and macOS runners cannot run the Linux server
  # image, and the adapter is platform-independent Go. `make test-integration`
  # runs the same matrix on a developer's machine.
  integration:
    name: Neo4j ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      # Every combination runs: knowing that a change breaks the OLD server but
      # not the new one is the whole point, and fail-fast would hide it.
      fail-fast: false
      matrix:
        include:
          # The oldest generation the adapter claims to support. Its constraint
          # vocabulary differs from current, so this entry is the one that
          # catches a fix applied only to the newer spelling.
          - image: neo4j:5.26-enterprise
            label: 5.26 Enterprise
          # The pinned default, matching adapter/neo4j/integration's defaultImage.
          - image: neo4j:2026.05.0-enterprise
            label: 2026.05 Enterprise
          # Community exercises the edition gating: the emitter drops to UNIQUE
          # alone, and the Enterprise-only capability tests skip rather than fail.
          - image: neo4j:2026.05.0-community
            label: 2026.05 Community
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration tests
        env:
          YAMMM_NEO4J_TEST_IMAGE: ${{ matrix.image }}
        # -count=1 because the environment variable that selects the image is
        # read at run time: a cached result from another matrix entry would be
        # reported as this entry's pass.
        run: go test -count=1 -tags neo4j_integration -timeout 20m -v ./adapter/neo4j/integration/
