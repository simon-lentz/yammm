name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Go tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run all checks
        run: pre-commit run --all-files
  extension-checks:
    name: Extension Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version-file: lsp/editors/vscode/.nvmrc
      - name: Install dependencies
        working-directory: lsp/editors/vscode
        run: npm ci
      - name: Typecheck
        working-directory: lsp/editors/vscode
        run: npm run check
      - name: Lint
        working-directory: lsp/editors/vscode
        run: npm run lint
      - name: Grammar tests
        working-directory: lsp/editors/vscode
        run: npm run test:grammar
      # The same endpoint @vscode/test-electron resolves 'stable' from, so the
      # cache key tracks exactly what the integration harness will download.
      - name: Resolve stable VS Code version
        id: vscode-version
        run: |
          version="$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache VS Code test install
        uses: actions/cache@v5
        with:
          path: lsp/editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.vscode-version.outputs.version }}
      - name: Integration tests
        working-directory: lsp/editors/vscode
        run: xvfb-run -a npm run test:integration
  build-extension:
    name: Build Extension ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            bin_dir: darwin-arm64
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            bin_dir: darwin-amd64
          - target: linux-x64
            goos: linux
            goarch: amd64
            bin_dir: linux-amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
            bin_dir: linux-arm64
          - target: win32-x64
            goos: windows
            goarch: amd64
            bin_dir: windows-amd64
            ext: .exe
          - target: win32-arm64
            goos: windows
            goarch: arm64
            bin_dir: windows-arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build LSP binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          BIN_DIR: ${{ matrix.bin_dir }}
          BIN_EXT: ${{ matrix.ext }}
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "lsp/editors/vscode/bin/${BIN_DIR}"
          go build -trimpath -ldflags="-s -w -X main.version=${BUILD_VERSION}" \
            -o "lsp/editors/vscode/bin/${BIN_DIR}/yammm-lsp${BIN_EXT}" \
            ./cmd/yammm-lsp
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: lsp/editors/vscode
        run: npm ci
      - name: Package VSIX
        working-directory: lsp/editors/vscode
        run: npx vsce package --target ${{ matrix.target }} --no-dependencies
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: lsp/editors/vscode/*.vsix
          retention-days: 7
