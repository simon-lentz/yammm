# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
run:
  # Analyze tests as well.
  tests: true
  # Don't let tools mutate go.mod/go.sum.
  modules-download-mode: readonly
issues:
  # Don't cap number of issues reported.
  max-issues-per-linter: 0
  max-same-issues: 0
  # CI should stay read-only -> run `make lint-fix` locally for auto-fixes.
  fix: false
linters:
  default: standard
  enable:
    - staticcheck # deep static analysis / bug finder
    - gosec # security checks
    - errcheck
    - wrapcheck
    - ineffassign
    - errorlint # proper Go 1.13 error wrapping
    - errchkjson # JSON encoding/decoding misuse
    - nilerr # 'if err != nil { return nil }' style bugs
    - nilnil # no (nil, nil) or invalid value with nil error
    - nilnesserr # extra guard for nil-error combinations
    - containedctx # no context.Context fields in structs
    - contextcheck # no non-derived background contexts
    - noctx # flag calls that should use context.Context
    - asciicheck # identifiers stay ASCII
    - bidichk # dangerous bidi sequences
    - unconvert
    - exptostd
    - paralleltest # safe use of t.Parallel
    - tparallel
    - thelper
    - modernize
    - perfsprint
    - unparam # unused parameters
    - intrange
    - unused
    - gocritic
    - nolintlint # enforce good //nolint usage
    - revive # configurable style linter
    # - gochecknoinits # ban init() functions
    # - gochecknoglobals # ban globals
    - exhaustive # enum-style switch exhaustiveness (scoped to //exhaustive:enforce)
  disable:
    - lll # long lines
    - funlen # function length
    - gocognit # cognitive complexity
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # VS Code extension embeds npm packages that may contain Go files.
      - path: "node_modules/"
        text: ".*"
      - path: "yammm/.*"
        linters:
          - wrapcheck
      - path: "expr/.*"
        linters:
          - wrapcheck
      - path: "cmd/yammm/.*"
        linters:
          - errcheck
          - wrapcheck
      - path: '(.+)_test\.go'
        linters:
          - revive
          - errcheck
          - errchkjson
          - wrapcheck
          - gochecknoinits
          - gochecknoglobals
      # LSP protocol types mirror the LSP spec; exported comments add no value.
      - path: "lsp/internal/protocol/.*"
        linters:
          - revive
      # LSP workspace scheduler: background context stored for lifecycle, not request-scoped.
      - path: "lsp/internal/workspace/.*"
        linters:
          - revive
      # Diagnostic codes use E_* naming convention by design (stable identifiers).
      - path: "diag/code\\.go"
        linters:
          - revive
      - path: "adapter/neo4j/errors\\.go"
        linters:
          - revive
      - path: "adapter/csv/errors\\.go"
        linters:
          - revive
      # Package names matching domain concepts (not stdlib collisions).
      - path: "adapter/json/.*"
        text: "avoid package names that conflict"
        linters:
          - revive
      - path: "adapter/csv/.*"
        text: "avoid package names that conflict"
        linters:
          - revive
      # ANTLR-generated method names use underscores (ExitSchema_name, etc.).
      - path: "schema/internal/parse/.*"
        linters:
          - revive
      # Package names matching domain concepts (not stdlib collisions).
      - path: "format/.*"
        linters:
          - revive
      - path: "internal/trace/.*"
        linters:
          - revive
      - path: "schema/build/.*"
        linters:
          - revive
      - path: "location/path/.*"
        linters:
          - revive
      # gosec G115 (integer overflow) fires on the uintptr->int file-descriptor
      # conversion that x/term.IsTerminal requires; fd values are 0/1/2 so it
      # cannot overflow. Scoped to this file so G115 stays active on the
      # integer-coercion paths that genuinely benefit from it.
      - path: "cmd/yammm/internal/cli/output\\.go"
        text: "G115"
        linters:
          - gosec
      # gosec G101 (hardcoded credentials) substring-matches identifier names
      # such as "token"/"secret"; test fixtures legitimately use them (e.g. the
      # tokenText field holding a lexer token's source span). Scope the
      # suppression to test files so G101 still guards shipped code.
      - path: '(.+)_test\.go'
        text: "G101"
        linters:
          - gosec
  settings:
    exhaustive:
      # Only switches annotated with //exhaustive:enforce are checked, so
      # enabling this linter does not churn the many intentional partial
      # switches across the codebase. A default case does NOT satisfy
      # exhaustiveness (default-signifies-exhaustive stays at its false
      # default), so a schema.ConstraintKind added after an annotated switch
      # fails CI rather than slipping through as a silent driver rejection.
      explicit-exhaustive-switch: true
    gosec:
      # Disable the experimental taint-analysis rules. They model web-application
      # threats (XSS, path traversal from attacker-controlled input) that do not
      # apply here: this is a CLI + library whose output goes to stdout/terminal
      # and whose file paths are the invoking user's own arguments, not untrusted
      # network input.
      excludes:
        - G703 # path traversal via taint analysis
        - G705 # XSS via taint analysis
    nolintlint:
      require-specific: true # //nolint:<linter>
      require-explanation: true # //nolint:<linter> // because ...
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - encoding/json.Marshal
        - encoding/json.MarshalIndent
        - "(*encoding/json.Encoder).Encode"
    errchkjson:
      check-error-free-encoding: true
    paralleltest:
      ignore-missing: true
      ignore-missing-subtests: true
