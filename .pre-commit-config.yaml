repos:
  # --- text hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Golden files, testscript archives, and formatter-input fixtures are
      # byte-exact test fixtures: their content (including the presence or
      # absence of a trailing newline and any trailing whitespace) is the
      # contract under test, so the text-rewriting hooks must never touch
      # them.
      - id: trailing-whitespace
        exclude: '(\.(golden|ys|txtar)$|^format/testdata/)'
      - id: end-of-file-fixer
        exclude: '(\.(golden|ys|txtar)$|^format/testdata/)'
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
  # --- yaml formatting ---
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  # --- GHA linting ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
        name: actionlint (GHA)
        files: ^\.github/workflows/.*\.ya?ml$
  # --- Go formatting, imports & modules ---
  #
  # Every tool is a `tool` directive in go.mod and is run through `go tool`, so
  # the local hook and CI run one pinned version; CI installs none.
  #
  # File-based and local, rather than tekwizely/pre-commit-golang's *-repo
  # hooks. Those run `gofumpt -l -d .` and `go mod tidy` from the repo root and
  # ignore the file list pre-commit passes; neither tool takes an exclude, so
  # the walk reached the gitignored .claude/ tree and failed on work product
  # that is never committed — formatter backups, and probe modules whose
  # replace directives name export directories that no longer exist. A
  # file-based hook sees only what git tracks, which is the same rule the repo
  # already applies to what may be committed.
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        language: system
        types: [go]
        exclude: '(^|/)vendor/'
        entry: go tool gofumpt -l -w
      - id: goimports
        name: goimports
        language: system
        types: [go]
        exclude: '(^|/)vendor/'
        entry: go tool goimports -l -w
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        pass_filenames: false
        files: '(\.go$)|(\bgo\.mod$)|(\bgo\.sum$)'
        entry: scripts/gomodtidy.sh
  # --- lint & test ---
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        language: system
        pass_filenames: false
        files: \.go$
        entry: go tool golangci-lint run
      - id: go-test
        name: go test
        language: system
        pass_filenames: false
        always_run: true
        entry: go test ./...
