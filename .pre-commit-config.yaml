repos:
  # --- text hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
  # --- yaml formatting ---
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  # --- GHA linting ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
        name: actionlint (GHA)
        files: ^\.github/workflows/.*\.ya?ml$
  # --- Go formatting & imports (multi-module auto-discovery) ---
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fumpt-repo
        name: gofumpt
      - id: go-imports-repo
        name: goimports
      - id: go-mod-tidy-repo
        name: go mod tidy
  # --- shell scripts ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck scripts
        files: ^scripts/.*\.sh$
  # --- multi-module lint & test (scripts handle root + lsp) ---
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        language: script
        pass_filenames: false
        files: \.go$
        entry: scripts/lint.sh
      - id: go-test
        name: go test
        language: script
        pass_filenames: false
        always_run: true
        entry: scripts/test.sh
